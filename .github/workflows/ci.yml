name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # spec: no "workflows" scope - it does not exist for GITHUB_TOKEN

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MANDATORY first job: resolve EVERY catalog pin before anything builds (spec).
  preflight:
    name: Pin preflight (fail fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve every declared pin (Maven/Gradle/portal)
        run: bash scripts/preflight_pins.sh

      - name: Verify SDK packages (platform 36, NDK r30)
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$SDKMANAGER" --list > /tmp/sdk.list 2>/dev/null || true
          grep -q "platforms;android-36" /tmp/sdk.list \
            || { echo "PIN VERIFICATION FAILED: platforms;android-36 not installable"; exit 1; }
          grep -q "ndk;30.0.16248370" /tmp/sdk.list \
            || { echo "PIN VERIFICATION FAILED: NDK 30.0.16248370 not installable"; exit 1; }
          echo "SDK packages verified: platforms;android-36 + ndk;30.0.16248370"

      - name: Declared pairing (R2/R4 - build job is the final arbiter)
        run: |
          echo "Kotlin 2.3.21 + KSP 2.3.14 (KSP2 standalone versioning)."
          echo "AGP 9.5.2 Kotlin mechanism: external org.jetbrains.kotlin.android, defined ONCE in build-logic (R2)."

  build:
    name: Build + guards
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK platform 36
        run: |
          SDKMANAGER=""
          for CAND in \
            "$(command -v sdkmanager)" \
            "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -n "$CAND" ] && [ -x "$CAND" ]; then SDKMANAGER="$CAND"; break; fi
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --install "platforms;android-36" > /dev/null
            echo "platforms;android-36 installed via $SDKMANAGER"
          else
            echo "WARN: sdkmanager not found on this runner image - relying on AGP auto-download (licenses are pre-accepted on GitHub images)"
          fi

      - name: Set up Gradle (provision + cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle assembleDebug + test
        run: ./gradlew assembleDebug test --stacktrace

      # ---- GUARD 1: no INTERNET in the merged manifest (fail-if-found) ----
      - name: Guard 1 - zero INTERNET permission
        run: |
          MANIFEST=$(find app/build/intermediates/merged_manifests -name AndroidManifest.xml | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "GUARD 1 FAILED: merged manifest not found"; exit 1
          fi
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "GUARD 1 FAILED: INTERNET permission found in merged manifest"; exit 1
          fi
          echo "GUARD 1 PASSED: no INTERNET permission in merged manifest"

      # ---- GUARD 2: no network libs in release runtime classpath (fail-if-found) ----
      - name: Guard 2 - no network libraries
        run: |
          DEPS=$(./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath || true)
          if echo "$DEPS" | grep -Eiq 'okhttp|retrofit|ktor|firebase|play-services|crashlytics'; then
            echo "GUARD 2 FAILED: forbidden network library in releaseRuntimeClasspath"; exit 1
          fi
          echo "GUARD 2 PASSED: no network libraries in release runtime classpath"

      # ---- GUARD 3: no libcurl in ANY native binary (fail-if-found) ----
      - name: Guard 3 - no libcurl in any .so
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "GUARD 3 FAILED: no debug APK found"; exit 1; fi
          rm -rf /tmp/apk-unzip && mkdir -p /tmp/apk-unzip
          unzip -q "$APK" -d /tmp/apk-unzip
          READELF="$(command -v llvm-readelf || command -v readelf)"
          NM="$(command -v llvm-nm || command -v nm)"
          shopt -s nullglob
          FOUND=0
          COUNT=0
          for so in /tmp/apk-unzip/lib/arm64-v8a/*.so; do
            COUNT=$((COUNT + 1))
            if "$READELF" -d "$so" | grep -q 'libcurl'; then
              echo "GUARD 3 FAILED: NEEDED libcurl in $so"; FOUND=1
            fi
            if "$NM" -D "$so" 2>/dev/null | grep -qE 'curl_easy_init|curl_global_init'; then
              echo "GUARD 3 FAILED: curl symbol in $so"; FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then exit 1; fi
          echo "GUARD 3 PASSED: scanned $COUNT native libs (0 in Phase 1 is expected)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
