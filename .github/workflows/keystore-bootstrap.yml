name: keystore bootstrap (one-time, manual)

# Spec workflow 4: generate the RELEASE keystore on CI, hand it to the user
# through a 1-day artifact, never print secrets to logs. Public repo warning:
# the artifact is downloadable by anyone while it exists - grab it fast and
# delete this run afterwards (README explains).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate release keystore
        run: |
          set -eu
          KS_PASS="$(openssl rand -hex 16)"
          KEY_PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -v \
            -keystore aura-release.keystore -storetype PKCS12 \
            -alias aura -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Aura Neon, O=aura-neon, C=IR"
          mkdir -p bundle
          mv aura-release.keystore bundle/
          base64 -w0 bundle/aura-release.keystore > bundle/keystore.b64
          {
            echo "Store these EXACTLY as GitHub Secrets (repo -> Settings -> Secrets):"
            echo "KEYSTORE_BASE64  = contents of keystore.b64 (single line)"
            echo "KEYSTORE_PASSWORD= $KS_PASS"
            echo "KEY_ALIAS        = aura"
            echo "KEY_PASSWORD     = $KEY_PASS"
            echo
            echo "Then DELETE this workflow run and its artifact from a public repo's point of view."
          } > bundle/README-SECRETS.txt
          echo "Keystore generated; values live ONLY inside the artifact, never in logs."

      - uses: actions/upload-artifact@v4
        with:
          name: aura-release-keystore
          path: bundle/
          retention-days: 1
